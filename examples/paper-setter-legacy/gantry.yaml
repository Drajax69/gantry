# Generated by `gantry import-legacy` (sanitized). Secrets live in the
# referenced private env files, never in this file. Edit freely; Gantry reloads
# it on every discovery pass.
#
# Layout expected next to this file:
#   examify/                      Git repository, Vite frontend
#   examify-backend/              Git repository, Node backend
#   examify-e2e/                  Git repository, Playwright harness (tooling)
#   examify-logic/                Git repository, Python logic service
#   examify-document-service/     Git repository, Python document renderer
#   AGENTS.md                     workspace-level agent instructions
#   .local/previews/profiles/papersetter/frontend.env   (private)
#   .local/previews/profiles/papersetter/backend.env    (private)
#   .local/previews/profiles/xamify/frontend.env        (private)
#   .local/previews/profiles/xamify/backend.env         (private)

apiVersion: gantry.dev/v1

project:
  id: papersetter
  name: Paper Setter
  defaultAgent: codex
  defaultPromptTemplate: builtin:paper-setter-legacy
  branchPrefix: codex
  worktreeRoot: .worktrees
  portBase: 5200
  portRange: 1000
  workspaceInstructions: [AGENTS.md, CLAUDE.md]

repositories:
  - id: frontend
    path: examify
    remote: origin
    defaultBranch: main
    worktree: true
    required: true
    role: product
    instructions: [AGENTS.md, CLAUDE.md]
  - id: backend
    path: examify-backend
    remote: origin
    defaultBranch: main
    worktree: true
    required: true
    role: product
    instructions: [AGENTS.md, CLAUDE.md]
  - id: e2e
    path: examify-e2e
    remote: origin
    defaultBranch: main
    worktree: false
    required: false
    role: tooling
    instructions: [AGENTS.md, CLAUDE.md]
  - id: logic
    path: examify-logic
    remote: origin
    defaultBranch: main
    worktree: true
    required: false
    role: product
    instructions: [AGENTS.md, CLAUDE.md]
  - id: document
    path: examify-document-service
    remote: origin
    defaultBranch: main
    worktree: true
    required: false
    role: product
    instructions: [AGENTS.md, CLAUDE.md]

services:
  - id: frontend
    repository: frontend
    runtime: vite
    install: npm ci --no-audit --no-fund
    healthUrl: http://127.0.0.1:${port}/
    openUrl: http://127.0.0.1:${port}/
    dependsOn: [backend]
    env: {}
    envFiles: [.env, .env.local, .env.preview.local]
    workDir: .
    hooks:
      preStart: []
      postStart: []
    platform: {}
    banner:
      enabled: true
      autoLogin: false
    # Optional auto-login module (project-provided). Used only when
    # banner.autoLogin is true and preview-login.json exists in the Gantry
    # data directory; the banner renders without signing in otherwise.
    entry: src/services/preview-login.ts

  - id: backend
    repository: backend
    runtime: node
    install: npm ci --no-audit --no-fund
    healthUrl: http://127.0.0.1:${port}/api-docs/
    openUrl: http://127.0.0.1:${port}/api-docs/
    dependsOn: [logic]
    env: {}
    envFiles: [.env, .env.local, .env.preview.local]
    workDir: .
    hooks:
      preStart: []
      postStart: []
    platform: {}
    entry: src/app.ts

  - id: logic
    repository: logic
    runtime: python
    healthUrl: http://127.0.0.1:${port}/health
    openUrl: http://127.0.0.1:${port}/health
    dependsOn: []
    env: {}
    envFiles: [.env, .env.local, .env.preview.local]
    workDir: .
    hooks:
      preStart: []
      postStart: []
    platform: {}
    entry: app

  - id: document
    repository: document
    runtime: python
    healthUrl: http://127.0.0.1:${port}/health
    openUrl: http://127.0.0.1:${port}/health
    dependsOn: []
    env: {}
    envFiles: [.env, .env.local, .env.preview.local]
    workDir: .
    hooks:
      preStart: []
      postStart: []
    platform: {}
    entry: render_api

environments:
  - id: papersetter
    label: Paper Setter
    default: true
    envFiles:
      frontend: .local/previews/profiles/papersetter/frontend.env
      backend: .local/previews/profiles/papersetter/backend.env
    env: {}
    requireKeys: {}
  - id: xamify
    label: Xamify
    default: false
    envFiles:
      frontend: .local/previews/profiles/xamify/frontend.env
      backend: .local/previews/profiles/xamify/backend.env
    env: {}
    requireKeys: {}

promptTemplates: []

scopes:
  - id: both
    label: Frontend + backend
    description: frontend and backend
  - id: frontend
    label: Frontend
    description: frontend
  - id: backend
    label: Backend
    description: backend
  - id: operations
    label: Operations
    description: operations and infrastructure
  - id: data
    label: Data
    description: data migrations and configuration
  - id: testing
    label: Testing
    description: testing and quality assurance

agents: []

safety:
  testRecordPrefix: TEST_
  manualTestFile: manual-test-needed.md
